global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/sing-box/alerts.yml

scrape_configs:
  - job_name: sing-box-proxy-1
    scrape_interval: 10s
    scrape_timeout: 5s
    sample_limit: 5000
    label_limit: 12
    body_size_limit: 8MB
    scheme: https
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/proxy-1.token
    tls_config:
      ca_file: /etc/prometheus/secrets/proxy-1.crt
    relabel_configs:
      - target_label: job
        replacement: sing-box
    static_configs:
      - targets: ['192.0.2.10:9119']
        labels:
          instance: proxy-1
