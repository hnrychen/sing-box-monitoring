name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
      - name: Check reproducible portable dashboard
        run: |
          python build_dashboard.py
          git diff --exit-code -- dashboard.json
  go-exporter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: false
      - run: go test -race ./... && go vet ./...
        working-directory: go-exporter
      - name: Compare Python and Go metric semantics
        run: |
          mkdir -p .runtime
          cd go-exporter
          CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o ../.runtime/sing-box-exporter-go .
          python3 ../compare_exporter.py --binary ../.runtime/sing-box-exporter-go
